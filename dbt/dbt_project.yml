name: shop_stream
version: "1.0.0"
config-version: 2
profile: shop_stream

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

on-run-start:
  - "SET TIME ZONE 'UTC'"

models:
  shop_stream:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
