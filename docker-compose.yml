# Local shop-stream stack.
# Defaults are inlined, so `docker compose up --build` works with no .env file.
# Copy .env.example to .env to change rates, ports, or credentials.
# Topic key and sink choices are explained in the README.

name: shop-stream

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The Kafka data volume is root-owned until this runs. The broker process
  # is uid 1000 (appuser) and cannot format storage otherwise.
  kafka-init:
    image: apache/kafka:3.8.1
    user: "0:0"
    entrypoint: ["bash", "-c", "mkdir -p /tmp/kraft-combined-logs && chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: "no"
    logging: *logging

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # 19092 is the compose-network listener. 9092 is what a process on the host uses.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${TOPIC_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx384M"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    mem_limit: 1024m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 25s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx320m"
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop} -d ${POSTGRES_DB:-shop}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    # Default cache is half of RAM. Cap it so a laptop stays usable.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  topic-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: "-Xms64M -Xmx256M"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      TOPIC: ${TOPIC:-shop.events}
      DLQ_TOPIC: ${DLQ_TOPIC:-shop.events.dlq}
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}
      TOPIC_RETENTION_MS: ${TOPIC_RETENTION_MS:-86400000}
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"
    mem_limit: 512m
    logging: *logging

  catalog-seed:
    build:
      context: .
      dockerfile: generator/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/?retryWrites=false}
      MONGO_DB: ${MONGO_DB:-shop}
      CATALOG_PATH: /app/catalog/products.json
    command: ["python", "-m", "seed_catalog"]
    restart: "no"
    mem_limit: 256m
    logging: *logging

  event-generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    depends_on:
      topic-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      TOPIC: ${TOPIC:-shop.events}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-5}
      SIM_SEED: ${SIM_SEED:-}
      BAD_EVENT_RATE: ${BAD_EVENT_RATE:-0.02}
      LATE_EVENT_RATE: ${LATE_EVENT_RATE:-0.05}
      LATE_EVENT_LAG_SECONDS: ${LATE_EVENT_LAG_SECONDS:-180}
      CATALOG_PATH: /app/catalog/products.json
      METRICS_PORT: "9096"
    ports:
      - "${GENERATOR_METRICS_PORT:-9096}:9096"
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    user: root
    depends_on:
      topic-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      catalog-seed:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      TOPIC: ${TOPIC:-shop.events}
      DLQ_TOPIC: ${DLQ_TOPIC:-shop.events.dlq}
      WATERMARK_DELAY: "${WATERMARK_DELAY:-1 minute}"
      GMV_WINDOW: "${GMV_WINDOW:-1 minute}"
      SESSION_GAP: "${SESSION_GAP:-30 seconds}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/?retryWrites=false}
      MONGO_DB: ${MONGO_DB:-shop}
      CHECKPOINT_DIR: ${CHECKPOINT_DIR:-/checkpoints/shop-events}
      TRIGGER_INTERVAL: ${TRIGGER_INTERVAL:-5 seconds}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-500}
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      PYTHONPATH: /opt/job
      METRICS_PORT: "9095"
    command:
      - --master
      - local[2]
      - --driver-memory
      - 1024m
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - --conf
      - spark.jars.ivy=/opt/ivy
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.ui.showConsoleProgress=false
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      - /opt/job/main.py
    ports:
      - "${SPARK_UI_PORT:-4040}:4040"
      - "${SPARK_METRICS_PORT:-9095}:9095"
    volumes:
      - spark-checkpoints:/checkpoints
    mem_limit: 2048m
    restart: unless-stopped
    logging: *logging

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: shop-stream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      JAVA_OPTS: "-Xms64M -Xmx256M"
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:19092"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  lag-exporter:
    build:
      context: ./observability/lag_exporter
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      TOPIC: ${TOPIC:-shop.events}
      CHECKPOINT_ROOT: /checkpoints
      METRICS_PORT: "9097"
    volumes:
      - spark-checkpoints:/checkpoints:ro
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${LAG_EXPORTER_PORT:-9097}:9097"
    mem_limit: 192m
    restart: unless-stopped
    logging: *logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-shop}@postgres:5432/${POSTGRES_DB:-shop}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging

  dbt:
    profiles: ["dbt"]
    build:
      context: ./dbt
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      DBT_PROFILES_DIR: /usr/app
    volumes:
      - ./dbt:/usr/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 768m
    logging: *logging

volumes:
  kafka-data:
  postgres-data:
  mongo-data:
  spark-checkpoints:
  prometheus-data:
