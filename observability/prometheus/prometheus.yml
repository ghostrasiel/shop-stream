global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: spark
    static_configs:
      - targets: ["spark:9095"]
  - job_name: generator
    static_configs:
      - targets: ["event-generator:9096"]
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: lag-exporter
    static_configs:
      - targets: ["lag-exporter:9097"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
